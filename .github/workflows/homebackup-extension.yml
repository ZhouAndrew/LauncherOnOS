name: Mint HomeBackUp Extension
on:
  push:
    paths:
      - 'extensions/homebackup/**'
      - '.github/workflows/homebackup-extension.yml'
  pull_request:
    paths:
      - 'extensions/homebackup/**'
      - '.github/workflows/homebackup-extension.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and verify extension package
        run: bash extensions/homebackup/tests/check-package.sh
      - name: Upload deb (not a release or live-machine acceptance)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mint-homebackup-extension-0.1.4
          path: extensions/homebackup/mint-homebackup-extension_0.1.4_all.deb
          if-no-files-found: error
