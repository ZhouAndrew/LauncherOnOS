name: Seal retired source archive (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seal-retired-source.yml
permissions:
  contents: write
concurrency:
  group: seal-retired-source
  cancel-in-progress: false
jobs:
  archive-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Archive static retired files only (NEVER EXECUTE THEM)
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="legacy-archives/MINT_TOOLBOX_DO_NOT_EXTRACT_2026-11-11.zip"
          if [[ -f "$archive" ]]; then
            echo "Historical archive already exists. No changes."
            exit 0
          fi
          mkdir -p legacy-archives
          git archive --format=zip --output="$archive" HEAD mint-toolbox/
          test -s "$archive"
          echo "Archived static Git objects only; no legacy code was executed."
          git add -- "$archive"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "archive: preserve retired source as DO NOT EXTRACT ZIP"
          git push origin HEAD:main
