name: Journal Two Android

on:
  push:
    branches: [feature/journal-two, main]
    paths: ['journal-two/**', '.github/workflows/journal-two.yml']
  pull_request:
    paths: ['journal-two/**', '.github/workflows/journal-two.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - name: Use the runner JDK 21 for the Gradle daemon
        run: printf 'toolchainVersion=21\n' > journal-two/gradle/gradle-daemon-jvm.properties
      - name: Build and test
        working-directory: journal-two
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Enable Linux KVM access
        run: sudo chmod a+rw /dev/kvm
      - name: Install test media tooling
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Exercise mixed-media editing and export on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          cores: 4
          ram-size: 4096M
          arch: x86_64
          disable-animations: true
          script: |
            adb install journal-two/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm dismiss-keyguard
            python3 journal-two/tests/android-acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-two-debug-apk
          path: journal-two/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-two-android-acceptance
          path: journal-acceptance/
