name: Rebuild reviewed security-extension packages (temporary)
on:
  push:
    branches:
      - fix/critical-extension-boundaries-20261108

permissions:
  contents: write

concurrency:
  group: rebuild-critical-extension-packages
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository == 'ZhouAndrew/LauncherOnOS' && github.ref == 'refs/heads/fix/critical-extension-boundaries-20261108'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/critical-extension-boundaries-20261108
          fetch-depth: 1
      - name: Prepare local Debian extension build tools
        run: |
          command -v dpkg-deb
          command -v xz
          command -v python3
      - name: Rebuild bundled debs and regenerate catalog hashes from reviewed source
        run: python3 system-extension-manager/build.py --extensions-only
      - name: Remove superseded vulnerable extension packages
        run: |
          git rm -f --ignore-unmatch -- \
            system-extension-manager/packages/mint-toolbox-extension-zip-trash_0.4.4_all.deb \
            system-extension-manager/packages/anki-time-travel_0.1.5_all.deb \
            system-extension-manager/packages/mint-homebackup-extension_0.1.5_all.deb \
            system-extension-manager/packages/mint-link-provider-extension_0.2.1_all.deb
      - name: Commit reproducible rebuilt binaries and catalog to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- system-extension-manager/extensions.json system-extension-manager/packages
          if git diff --cached --quiet; then
            echo 'No package changes.'
          else
            git commit -m 'build(security): release guarded HomeBackUp, Link Provider, ZIP and Anki extensions'
            git push origin HEAD:refs/heads/fix/critical-extension-boundaries-20261108
          fi
