name: System Extension Manager
on:
  push:
    branches: [main, feat/system-extension-manager-anki]
  pull_request:
permissions:
  contents: read
jobs:
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-gi gir1.2-gtk-3.0 xvfb x11-utils desktop-file-utils zip unzip libglib2.0-bin xz-utils
      - name: Validate committed packages and pinned sources before rebuilding
        run: |
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          root = Path('system-extension-manager')
          for row in json.loads((root / 'extensions.json').read_text()):
              if row.get('kind') == 'portable':
                  assert hashlib.sha256((root / row['script']).read_bytes()).hexdigest() == row['sha256']
                  continue
              assert hashlib.sha256((root / row['deb']).read_bytes()).hexdigest() == row['sha256']
              for path, digest in row['source']['files'].items():
                  assert hashlib.sha256((root / path).read_bytes()).hexdigest() == digest, path
          PYCODE
      - name: Build installable extensions and portable security tool
        run: python3 system-extension-manager/build.py --extensions-only
      - name: Validate catalog and packaged extension source hashes
        run: |
          echo 'Validating the rebuilt package against its generated catalog and pinned source hashes'
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          root = Path('system-extension-manager')
          entries = json.loads((root / 'extensions.json').read_text())
          assert {row['id'] for row in entries} == {'zip-trash','anki-time-travel','homebackup','link-provider','security-updates'}
          for row in entries:
              if row.get('kind') == 'portable':
                  assert 'deb' not in row and 'package' not in row and 'source' not in row
                  assert (root / row['script']).is_file()
                  continue
              assert hashlib.sha256((root / row['deb']).read_bytes()).hexdigest() == row['sha256'], row['id']
              for path, digest in row['source']['files'].items():
                  assert hashlib.sha256((root / path).read_bytes()).hexdigest() == digest, path
          PYCODE
      - name: Check package reproducibility
        run: |
          sha256sum system-extension-manager/packages/mint-homebackup-extension_0.1.5_all.deb > /tmp/homebackup-sha
          python3 system-extension-manager/sources/homebackup/build.py --output-dir system-extension-manager/packages
          sha256sum -c /tmp/homebackup-sha
          sha256sum system-extension-manager/packages/mint-link-provider-extension_0.2.1_all.deb > /tmp/link-provider-sha
          python3 system-extension-manager/sources/link-provider/build.py --output-dir system-extension-manager/packages
          sha256sum -c /tmp/link-provider-sha
      - name: Verify portable updater has no extension package
        run: |
          test -f system-extension-manager/sources/security-updates/security_updates.py
          test ! -e system-extension-manager/packages/mint-security-updates-extension_0.1.0_all.deb
          /usr/bin/python3 -m py_compile system-extension-manager/sources/security-updates/security_updates.py
      - name: Validate desktop entries
        run: desktop-file-validate system-extension-manager/system-extension-manager.desktop system-extension-manager/sources/anki-time-travel/anki-time-travel.desktop system-extension-manager/sources/link-provider/mint-link-provider.desktop
      - name: Test extension manager and catalog
        run: xvfb-run -a python3 -m unittest discover -s system-extension-manager/tests -v
      - name: Smoke test HomeBackUp GTK 3 window as normal user
        run: xvfb-run -a /usr/bin/python3 system-extension-manager/sources/homebackup/gui.py --smoke-test
      - name: Verify installed Link Provider entry points and removal
        run: |
          sudo apt-get install -y ./system-extension-manager/packages/mint-link-provider-extension_0.2.1_all.deb
          export XDG_CONFIG_HOME="$RUNNER_TEMP/link-provider-config" XDG_DATA_HOME="$RUNNER_TEMP/link-provider-data"
          bash system-extension-manager/run.sh --list | grep -F $'link-provider\tLink Provider\tEnabled: 0.2.1'
          for entry in direct menu manager; do
            xvfb-run -a bash -eu -c '
              case "$1" in
                direct) link-provider & ;;
                menu) gio launch /usr/share/applications/mint-link-provider.desktop & ;;
                manager) bash system-extension-manager/run.sh --open link-provider & ;;
              esac
              for _ in $(seq 1 60); do
                if xwininfo -name "Link Provider" 2>/dev/null | grep -q "Map State: IsViewable"; then exit 0; fi
                sleep 0.1
              done
              exit 1
            ' _ "$entry"
          done
          link-provider register-handler
          link-provider add-app test /usr/bin/touch "$RUNNER_TEMP/link-provider-launched"
          gio open caldav-run://test
          for _ in $(seq 1 60); do
            test ! -f "$RUNNER_TEMP/link-provider-launched" || break
            sleep 0.1
          done
          test -f "$RUNNER_TEMP/link-provider-launched"
          sudo apt-get remove -y mint-link-provider-extension
          bash system-extension-manager/run.sh --list | grep -F $'link-provider\tLink Provider\tDisabled'
          test ! -e /usr/share/applications/mint-link-provider.desktop
          test -f "$XDG_CONFIG_HOME/link-provider/links.json"
          ! gio open caldav-run://test
      - name: Build distributable manager package
        run: python3 system-extension-manager/build.py --package --output-dir "$RUNNER_TEMP/manager"
      - name: Check bundled packages and portable security script are distributed
        run: |
          dpkg-deb -c "$RUNNER_TEMP/manager/"*.deb | grep 'packages/mint-homebackup-extension_0.1.5_all.deb'
          dpkg-deb -c "$RUNNER_TEMP/manager/"*.deb | grep 'packages/mint-link-provider-extension_0.2.1_all.deb'
          dpkg-deb -c "$RUNNER_TEMP/manager/"*.deb | grep 'sources/security-updates/security_updates.py'
          ! dpkg-deb -c "$RUNNER_TEMP/manager/"*.deb | grep 'packages/mint-security-updates-extension'
      - name: Bundle portable manager source
        run: |
          (cd system-extension-manager && zip -q -r "$GITHUB_WORKSPACE/System-Extension-Manager-source.zip" . -x 'dist/*' '*/__pycache__/*' '*.pyc' 'sources/homebackup/build-mint-homebackup-extension/*' 'sources/homebackup/BUILD-NOTES.md')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: System-Extension-Manager-Portable-Security-Updates
          path: |
            System-Extension-Manager-source.zip
            system-extension-manager/packages/mint-link-provider-extension_0.2.1_all.deb
            ${{ runner.temp }}/manager/system-extension-manager_*.deb
