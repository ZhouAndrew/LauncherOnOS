name: System Extension Manager
on:
  push:
    branches: [main, feat/system-extension-manager-anki]
  pull_request:
permissions:
  contents: read
jobs:
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-gi gir1.2-gtk-3.0 xvfb desktop-file-utils zip unzip libglib2.0-bin xz-utils
      - name: Validate committed packages and source pins before rebuilding
        run: |
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          root = Path('system-extension-manager')
          for row in json.loads((root / 'extensions.json').read_text()):
              assert hashlib.sha256((root / row['deb']).read_bytes()).hexdigest() == row['sha256']
              for path, digest in row['source']['files'].items():
                  assert hashlib.sha256((root / path).read_bytes()).hexdigest() == digest, path
          PYCODE
      - name: Build bundled extensions (including HomeBackUp GUI)
        run: python3 system-extension-manager/build.py --extensions-only
      - name: Validate catalog and packaged extension source hashes
        run: |
          echo 'Validating the rebuilt package against its generated catalog and pinned source hashes'
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          root = Path('system-extension-manager')
          entries = json.loads((root / 'extensions.json').read_text())
          assert {row['id'] for row in entries} == {'zip-trash','anki-time-travel','homebackup','security-updates'}
          for row in entries:
              assert hashlib.sha256((root / row['deb']).read_bytes()).hexdigest() == row['sha256'], row['id']
              for path, digest in row['source']['files'].items():
                  assert hashlib.sha256((root / path).read_bytes()).hexdigest() == digest, path
          PYCODE
      - name: Check package reproducibility
        run: |
          sha256sum system-extension-manager/packages/mint-homebackup-extension_0.1.4_all.deb > /tmp/homebackup-sha
          python3 system-extension-manager/sources/homebackup/build.py --output-dir system-extension-manager/packages
          sha256sum -c /tmp/homebackup-sha
      - name: Verify manual security-update package and reproducibility
        run: |
          sha256sum system-extension-manager/packages/mint-security-updates-extension_0.1.1_all.deb > /tmp/security-update-sha
          python3 system-extension-manager/sources/security-updates/build.py --output-dir system-extension-manager/packages
          sha256sum -c /tmp/security-update-sha
          dpkg-deb -c system-extension-manager/packages/mint-security-updates-extension_0.1.1_all.deb | grep 'usr/bin/mint-security-updates'
          ! dpkg-deb -c system-extension-manager/packages/mint-security-updates-extension_0.1.1_all.deb | grep -E 'systemd|cron\.'
      - name: Validate desktop entries
        run: desktop-file-validate system-extension-manager/system-extension-manager.desktop system-extension-manager/sources/anki-time-travel/anki-time-travel.desktop system-extension-manager/sources/security-updates/security-updates.desktop
      - name: Test extension manager and catalog
        run: xvfb-run -a python3 -m unittest discover -s system-extension-manager/tests -v
      - name: Smoke test HomeBackUp GTK 3 window as normal user
        run: xvfb-run -a /usr/bin/python3 system-extension-manager/sources/homebackup/gui.py --smoke-test
      - name: Build distributable manager package
        run: python3 system-extension-manager/build.py --package --output-dir "$RUNNER_TEMP/manager"
      - name: Check distributed manager contains HomeBackUp GUI package
        run: |
          dpkg-deb -c "$RUNNER_TEMP/manager/"*.deb | grep 'packages/mint-homebackup-extension_0.1.4_all.deb'
      - name: Bundle portable manager source
        run: |
          (cd system-extension-manager && zip -q -r "$GITHUB_WORKSPACE/System-Extension-Manager-source.zip" . -x 'dist/*' '*/__pycache__/*' '*.pyc' 'sources/homebackup/build-mint-homebackup-extension/*' 'sources/homebackup/BUILD-NOTES.md')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: System-Extension-Manager-GUI-Four-Extensions
          path: |
            System-Extension-Manager-source.zip
            ${{ runner.temp }}/manager/system-extension-manager_*.deb
