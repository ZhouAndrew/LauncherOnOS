name: System Extension Manager
on:
  push:
    branches: [main, feat/system-extension-manager-anki]
  pull_request:
jobs:
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb desktop-file-utils zip unzip libglib2.0-bin xz-utils
      - name: Build bundled extensions (including HomeBackUp)
        run: python3 system-extension-manager/build.py --extensions-only
      - name: Validate catalog against actual bundled packages and fixed source hashes
        run: |
          git diff --exit-code -- system-extension-manager/packages
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('system-extension-manager')
          catalog = json.loads((root/'extensions.json').read_text())
          assert {row['id'] for row in catalog} == {'zip-trash','anki-time-travel','homebackup'}
          for row in catalog:
              data = (root / row['deb']).read_bytes()
              assert hashlib.sha256(data).hexdigest() == row['sha256'], row['id']
              for path, expected in row['source']['files'].items():
                  assert hashlib.sha256((root/path).read_bytes()).hexdigest() == expected, path
          PY
      - name: Check HomeBackUp package reproducibility
        run: |
          sha256sum system-extension-manager/packages/mint-homebackup-extension_0.1.0_all.deb > /tmp/homebackup-sha
          python3 system-extension-manager/sources/homebackup/build.py --output-dir system-extension-manager/packages
          sha256sum -c /tmp/homebackup-sha
      - name: Validate desktop entries
        run: desktop-file-validate system-extension-manager/system-extension-manager.desktop system-extension-manager/sources/anki-time-travel/anki-time-travel.desktop
      - name: Test CLI, builds, Anki import, ZIP/Trash and HomeBackUp catalog
        run: xvfb-run -a python3 -m unittest discover -s system-extension-manager/tests -v
      - name: Build installable manager deb for publication
        run: python3 system-extension-manager/build.py --package --output-dir "$RUNNER_TEMP/manager"
      - name: Verify packaged manager includes HomeBackUp extension
        run: |
          dpkg-deb -f "$RUNNER_TEMP/manager/"*.deb Package Version
          dpkg-deb -c "$RUNNER_TEMP/manager/"*.deb | grep 'packages/mint-homebackup-extension_0.1.0_all.deb'
      - name: Archive portable source release with built-in extensions
        run: |
          (cd system-extension-manager && zip -q -r "$GITHUB_WORKSPACE/System-Extension-Manager-source.zip" . -x 'dist/*' '*/__pycache__/*' '*.pyc' 'sources/homebackup/build-mint-homebackup-extension/*' 'sources/homebackup/BUILD-NOTES.md')
      - uses: actions/upload-artifact@v4
        with:
          name: System-Extension-Manager-with-HomeBackUp
          path: |
            System-Extension-Manager-source.zip
            ${{ runner.temp }}/manager/system-extension-manager_*.deb
